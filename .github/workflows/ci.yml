name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Unit tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build Linux binaries
        run: go build ./cmd/pqtunneld ./cmd/pqtunnel-client ./cmd/pqtunnel-pki

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Cross-compile command-line clients and server
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for pkg in pqtunneld pqtunnel-client pqtunnel-pki; do
            ext=''
            if [[ "$GOOS" == windows ]]; then ext='.exe'; fi
            go build -trimpath -o "dist/${pkg}-${GOOS}-${GOARCH}${ext}" "./cmd/${pkg}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  shell-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
