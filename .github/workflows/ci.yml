name: PQTunnel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build server
        run: go build ./cmd/pqtunneld

      - name: Build client
        run: go build ./cmd/pqtunnel-client

      - name: Build PKI tool
        run: go build ./cmd/pqtunnel-pki

      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
