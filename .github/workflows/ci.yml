name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Unit tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build Linux binaries
        run: go build ./cmd/pqtunneld ./cmd/pqtunnel-client ./cmd/pqtunnel-pki

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Cross-compile command-line clients and server
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for pkg in pqtunneld pqtunnel-client pqtunnel-pki; do
            ext=''
            if [[ "$GOOS" == windows ]]; then ext='.exe'; fi
            go build -trimpath -o "dist/${pkg}-${GOOS}-${GOARCH}${ext}" "./cmd/${pkg}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  shell-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Install nftables parser for check-only regression test
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
      - name: Test selective site-to-site nftables preview
        shell: bash
        run: bash scripts/test-site-to-site-selective.sh


  site-to-site-netns-integration:
    name: netns site-to-site (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build isolated lab binaries with the CI Go toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/pqtunnel-bin"
          go build -o "$RUNNER_TEMP/pqtunnel-bin/pqtunneld" ./cmd/pqtunneld
          go build -o "$RUNNER_TEMP/pqtunnel-bin/pqtunnel-client" ./cmd/pqtunnel-client
          go build -o "$RUNNER_TEMP/pqtunnel-bin/pqtunnel-pki" ./cmd/pqtunnel-pki
      - name: Install namespace ping tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping
      - name: Run isolated dual-stack site-to-site TUN test
        run: sudo env PQTUNNEL_BIN_DIR="$RUNNER_TEMP/pqtunnel-bin" bash scripts/test-site-to-site-netns.sh
