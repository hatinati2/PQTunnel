name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build release assets
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in 'linux amd64' 'linux arm64' 'windows amd64'; do
            read -r goos goarch <<< "$target"
            pkg="PQTunnel-${GITHUB_REF_NAME}-${goos}-${goarch}"
            mkdir -p "dist/$pkg"
            for cmd in pqtunneld pqtunnel-client pqtunnel-pki; do
              ext=''
              if [[ "$goos" == windows ]]; then ext='.exe'; fi
              GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/$pkg/${cmd}${ext}" "./cmd/$cmd"
            done
            cp README.md README.fa.md SECURITY.md LICENSE CHANGELOG.md "dist/$pkg/"
            cp -R scripts deploy docs "dist/$pkg/"
            tar -C dist -czf "dist/${pkg}.tar.gz" "$pkg"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
