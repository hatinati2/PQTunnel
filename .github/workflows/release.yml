name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  integration-test:
    name: netns integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build isolated lab binaries
        run: |
          mkdir -p "$RUNNER_TEMP/pqtunnel-bin"
          go build -o "$RUNNER_TEMP/pqtunnel-bin/pqtunneld" ./cmd/pqtunneld
          go build -o "$RUNNER_TEMP/pqtunnel-bin/pqtunnel-client" ./cmd/pqtunnel-client
          go build -o "$RUNNER_TEMP/pqtunnel-bin/pqtunnel-pki" ./cmd/pqtunnel-pki
      - name: Install namespace test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping nftables tcpdump
      - name: Run isolated dual-stack site-to-site TUN test
        run: sudo env PQTUNNEL_BIN_DIR="$RUNNER_TEMP/pqtunnel-bin" bash scripts/test-site-to-site-netns.sh
      - name: Test selective TCP/UDP port forwarding over dual-stack TUN
        run: sudo env PQTUNNEL_BIN_DIR="$RUNNER_TEMP/pqtunnel-bin" bash scripts/test-selective-forward-netns.sh
      - name: Test selective TCP/UDP egress over dual-stack TUN
        run: sudo env PQTUNNEL_BIN_DIR="$RUNNER_TEMP/pqtunnel-bin" bash scripts/test-selective-egress-netns.sh
      - name: Test selective network helper fail-closed and rollback
        run: sudo bash scripts/test-site-to-site-selective-fail-closed.sh

  release:
    needs: integration-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Run unit tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Install nftables parser for check-only regression test
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
      - name: Test selective site-to-site nftables preview
        shell: bash
        run: bash scripts/test-site-to-site-selective.sh
      - name: Build release assets
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in 'linux amd64' 'linux arm64' 'windows amd64'; do
            read -r goos goarch <<< "$target"
            pkg="PQTunnel-${GITHUB_REF_NAME}-${goos}-${goarch}"
            mkdir -p "dist/$pkg"
            for cmd in pqtunneld pqtunnel-client pqtunnel-pki; do
              ext=''
              if [[ "$goos" == windows ]]; then ext='.exe'; fi
              GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "dist/$pkg/${cmd}${ext}" "./cmd/$cmd"
            done
            cp README.md README.fa.md SECURITY.md LICENSE CHANGELOG.md "dist/$pkg/"
            cp -R scripts deploy docs "dist/$pkg/"
            tar -C dist -czf "dist/${pkg}.tar.gz" "$pkg"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
